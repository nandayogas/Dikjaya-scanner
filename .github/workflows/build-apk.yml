name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder android (lib dan pubspec dijaga)
        run: |
          mkdir -p /tmp/bak
          cp -r lib /tmp/bak/lib
          cp pubspec.yaml /tmp/bak/pubspec.yaml
          flutter create --platforms=android --project-name dikjaya_scanner .
          rm -rf lib test
          cp -r /tmp/bak/lib lib
          cp /tmp/bak/pubspec.yaml pubspec.yaml

      - name: Izin Bluetooth, internet, dan nama aplikasi
        run: |
          python3 - << 'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>'''
          s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + perms, s, count=1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="DIKJAYA Scanner"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Tanda tangan dengan keystore tetap
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/unsigned.apk
          "$APKSIGNER" sign --ks /tmp/release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out build/app/outputs/flutter-apk/DIKJAYA-Scanner.apk /tmp/unsigned.apk

      - name: Siapkan nama file APK
        run: |
          cd build/app/outputs/flutter-apk
          [ -f DIKJAYA-Scanner.apk ] || cp app-release.apk DIKJAYA-Scanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dikjaya-scanner-apk
          path: build/app/outputs/flutter-apk/DIKJAYA-Scanner.apk

      - name: Rilis ke GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/DIKJAYA-Scanner.apk
